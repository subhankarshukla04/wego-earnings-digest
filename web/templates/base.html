<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Wego Earnings Digest{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a href="{{ url_for('index') }}" class="brand">
      <span class="brand-mark">W</span>
      <span class="brand-text">
        <span class="brand-line1">Wego Earnings Digest</span>
        <span class="brand-line2">Quarterly competitive intelligence</span>
      </span>
    </a>
    <nav>
      <a href="{{ url_for('index') }}">Editions</a>
      <a href="{{ url_for('about') }}">How it works</a>
      <a href="{{ url_for('run') }}" class="run-btn">Run pipeline</a>
    </nav>
  </div>
</header>
<main>{% block content %}{% endblock %}</main>
<footer>
  <div class="footer-inner">
    <span>Built by Subhankar Shukla · {{ '2026' }}</span>
    <span class="footer-meta">Public earnings transcripts → LLM synthesis → quarterly digest. <a href="{{ url_for('about') }}">Pipeline →</a></span>
  </div>
</footer>
</body>
</html>
